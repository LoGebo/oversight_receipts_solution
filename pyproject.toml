[project]
name = "expense-validator"
version = "0.1.0"
requires-python = ">=3.12"  # Fraction format specs such as :.2f need 3.12
dependencies = ["anthropic>=2.3,<3", "httpx>=0.28,<1", "pydantic>=2.7,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validator"]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.3",
]
notebook = ["jupyter", "pandas", "matplotlib"]
viewer = ["streamlit>=1.40,<2"]

[tool.ruff.lint]
select = ["F", "B", "RUF100", "E731", "ARG", "RUF059"]
ignore = ["E501"]
